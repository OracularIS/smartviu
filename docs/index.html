<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SmartViu Documentation</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Description">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/sidebar.min.css" />
  <link rel="stylesheet" href="sidebar.css" />
  <link rel="stylesheet" href="//unpkg.com/docsify-accordion/src/style.css">
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'SmartViu',
      repo: 'OracularIS/smartviu',
      homepage: 'readme.md',
      coverpage: true,
      search: 'auto', // default,
      loadSidebar: true,
      subMaxLevel: 4,
      auto2top: true,
       // complete configuration parameters
      search: {
        maxAge: 86400000, // Expiration time, the default one day
        paths: 'auto', // or 'auto'
        placeholder: 'Type to search',
              // Headline depth, 1 - 6
        depth: 6,

        hideOtherSidebarContent: false, // whether or not to hide other sidebar content

        // To avoid search index collision
        // between multiple websites under the same domain
        namespace: 'autest',
      },
      plugins: [
        function(hook, vm) {
          // Click-to-zoom for images. Registered in the capture phase so the
          // body click handler below cannot swallow the event.
          hook.init(function() {
            var overlay = null;
            function closeZoom() {
              if (overlay) { overlay.remove(); overlay = null; }
            }
            document.addEventListener('keydown', function(e) {
              if (e.key === 'Escape') closeZoom();
            });
            document.addEventListener('click', function(e) {
              var t = e.target;
              if (overlay && t === overlay) { closeZoom(); return; }
              if (!t || t.tagName !== 'IMG' || !t.closest('.markdown-section') || t.hasAttribute('onclick')) return;
              e.preventDefault();
              e.stopPropagation();
              closeZoom();
              overlay = document.createElement('div');
              overlay.style.cssText = 'position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.8);overflow:auto;cursor:zoom-out;display:flex;';
              var img = document.createElement('img');
              img.src = t.src;
              img.alt = t.alt;
              var fit = true;
              function applyFit() {
                img.style.cssText = fit
                  ? 'max-width:95vw;max-height:95vh;margin:auto;cursor:zoom-in;background:#fff;'
                  : 'max-width:none;margin:auto;cursor:zoom-out;background:#fff;';
              }
              applyFit();
              img.addEventListener('click', function(ev) {
                ev.stopPropagation();
                fit = !fit;
                applyFit();
              });
              overlay.appendChild(img);
              document.body.appendChild(overlay);
            }, true);
          });
          hook.doneEach(function() {
               document.querySelectorAll('.sidebar-nav li').forEach(function(item) {
              item.addEventListener('click', function(event) {
                const target = event.target;
                if (target.nodeName=='UL') {
                event.stopPropagation();
                }
              });
            });
            document.body.addEventListener('click', function(event) {
              const sidebar = document.querySelector('.sidebar-nav');
              if (sidebar && !sidebar.contains(event.target)) {
                event.stopPropagation();
              }
            });
          });
        }
      ]
    };
  </script>
  <!-- Docsify v4 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/docsify-sidebar-collapse.min.js"></script>
  <script src="//unpkg.com/docsify-accordion/src/index.js"></script>
</body>
</html>
